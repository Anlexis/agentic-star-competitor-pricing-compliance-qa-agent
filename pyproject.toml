[project]
name = "ret-c2-667"
version = "0.1.0"
description = "ECPricingComplianceValidationAgent — AgentCore Template"
requires-python = ">=3.11"
# The framework (agenticstar-agentcore) is NOT a public-PyPI dependency; it is
# provided by CI per repository generation — a stub package on PYTHONPATH for older repos,
# or installed from the package registry for wheel-era repos (see the dual-mode
# run-tests job in the pipeline definition). Pinning it here would make `pip install -e .`
# fail because it is not resolvable from the default index.
dependencies = [
    "agenticstar-agentcore[marketplace,openai]==1.0.3",]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "pytest-asyncio==1.4.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
    "types-PyYAML==6.0.12.20260815",
]

[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
# The framework wheel ships no type information, so every symbol imported from
# it resolves to Any. Without this, `class X(SomeFrameworkBase)` is "subclassing
# Any" and the whole file goes red for a reason that has nothing to do with the
# template's own code.
disallow_subclassing_any = false
# The published sample files under src/examples/ are reference material, not
# part of the agent; they are excluded rather than edited to satisfy a checker.
exclude = ["src/examples/"]

[[tool.mypy.overrides]]
module = ["framework.*", "shared.*", "langgraph.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Same root cause, one step further: because the framework's AgentState resolves
# to Any, `class State(AgentState)` makes mypy reject EVERY field annotation in
# the module with `valid-type`. The errors are all one cause, so the code is
# suppressed for that module only rather than chased field by field.
module = ["src.schemas.state"]
disable_error_code = ["valid-type"]
