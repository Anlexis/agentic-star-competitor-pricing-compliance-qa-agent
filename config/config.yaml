# Runtime parameters — loaded by AgentRegistry, passed as Graph(config=...).
# Separate from config/agent.yaml (the static manifest).

max_retry: 3
timeout_s: 30

# carried from the legacy manifest root by migrate_manifest.py
retrieval:
  top_k: 4
  score_threshold: 0.25
  kb_path: "config/kb/pricing_compliance_kb.json"

# carried from the legacy manifest root by migrate_manifest.py
llm:
  temperature: 0.0
  max_tokens: 1500
